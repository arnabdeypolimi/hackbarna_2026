<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mock TV client</title>
  <style>
    body { background:#111; color:#eee; font:14px system-ui; margin:0; padding:24px; }
    #top { display:flex; gap:24px; align-items:flex-start; max-width:1100px; }
    #grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; flex:1; }
    .tile { background:#222; border:2px solid transparent; border-radius:8px;
            padding:12px; text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center; }
    .tile img { width:100%; max-width:140px; border-radius:4px; }
    .tile small { color:#999; }
    .tile.focused { border-color:#4ea1ff; }
    #video { width:256px; height:384px; background:#000; border-radius:8px; }
    #captions { margin:12px 0; min-height:2.5em; }
    #captions b { color:#4ea1ff; }
    #log { margin-top:24px; height:240px; overflow:auto; background:#000;
           padding:12px; border-radius:8px; white-space:pre-wrap; font-family:ui-monospace,monospace; }
    #status { color:#4ea1ff; }
    button { background:#4ea1ff; color:#000; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
  </style>
</head>
<body>
  <h1>Mock TV client</h1>
  <p>
    Agent: <span id="status">disconnected</span> · Playback: <span id="playback">stopped</span> · User: <span id="user">-</span>
    · <button id="talk">Talk</button> <label><input type="checkbox" id="avatar-on" checked /> avatar</label>
  </p>
  <div id="captions"><div><b>you:</b> <span id="you"></span></div><div><b>avatar:</b> <span id="avatar"></span></div></div>
  <div id="top">
    <div id="grid"></div>
    <div><video id="video" autoplay playsinline></video><audio id="audio" autoplay></audio></div>
  </div>
  <div id="log"></div>
  <script src="client.js"></script>
</body>
</html>
