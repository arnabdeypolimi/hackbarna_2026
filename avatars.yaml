# Avatar and language catalog. Loaded once at startup (tv_avatar.catalog).
#
# A session pins one avatar and one language at creation (POST /sessions).
# Each avatar carries exactly one Cartesia voice: sonic-3 voices are
# multilingual, so the same voice speaks every language listed below.
#
# Override the file location with AVATARS_FILE=/path/to/avatars.yaml.

default_avatar: cara
default_language: en

languages:
  - code: en
    name: English
    native_name: English
  - code: es
    name: Spanish
    native_name: Español
  - code: fr
    name: French
    native_name: Français
  - code: ca
    name: Catalan
    native_name: Català

# `languages` restricts which session languages an avatar may be paired
# with; omit it to allow every language listed above.
avatars:
  - id: cara
    name: Cara
    description: Warm, quick and natural. The default host.
    anam_avatar_id: 8e6215af-290b-443f-87f8-f68f7890d9c6
    anam_avatar_model: cara-4
    voice: f786b574-daa5-4673-aa0c-cbe3e8534c02
  - id: igor
    name: Igor
    description: Male host. English only.
    # TODO: replace with Igor's own Anam avatar id; reusing Cara's for now.
    anam_avatar_id: 8e6215af-290b-443f-87f8-f68f7890d9c6
    anam_avatar_model: cara-4
    voice: 228fca29-3a0a-435c-8728-5cb483251068
    languages: [en]
  - id: lucia
    name: Lucía
    description: Female host. Spanish only.
    anam_avatar_id: dc9aa3e1-32f2-499e-9921-ecabac1076fc
    anam_avatar_model: cara-4
    # Cartesia "Spanish-speaking Lady": native Castilian, conversational.
    voice: 846d6cb0-2301-48b6-9683-48f5618ea2f6
    languages: [es]
  - id: chloe
    name: Chloé
    description: Female host. French only.
    anam_avatar_id: 27e12daa-50fc-4384-93c2-ebca73f1f78d
    anam_avatar_model: cara-4
    # Cartesia "French Conversational Lady": native French, conversational.
    voice: a249eaff-1e96-4d2c-b23b-12efa4f66f41
    languages: [fr]
